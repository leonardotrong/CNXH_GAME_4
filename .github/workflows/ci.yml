name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w client
      # Giả lập tải rút gọn: 63 bot, 2 lượt Bàn Cờ, 1 quả bom.
      - run: npm run simulate -- --turns 2 --bombs 1
